<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    <title>Talento 60</title>
   <link rel="stylesheet" href="style.css">

</head> 
<body>
    <header class="navbar">
        
        <!-- LOGO -->
        <div class="logo">
            <span class="logo-texto">Talento<span class="logo-numero">60</span></span>
        </div>

        <!-- MENÚ CENTRAL -->
        <nav class="menu">
            <a href="#" class="nav-link">Inicio & Explorar</a>
            <a href="#" class="nav-link active">Feed de Evaluación</a>
            <a href="#" class="nav-link">Estudio de Grabación</a>
            <a href="#" class="nav-link">Gestión de Vacantes</a>
        </nav>
        <!-- ACCIONES DE LA DERECHA -->
        <div class="acciones">
            <!-- Selector Empresa / Candidato -->
            <div class="selector-rol">
                <span class="opcion-rol active">Empresa</span>
                <span class="opcion-rol">Candidato</span>
            </div>

            <!-- Botón Subir Video -->
            <button class="btn-subir">Subir Video</button>

            <!-- Notificación y Perfil -->
            <div class="perfil-usuario">
                <span class="icono-campana">🔔</span>
                <img src="https://via.placeholder.com/35" alt="Foto de Perfil" class="foto-perfil">
            </div>
        </div>

    </header>

</body>
    </header>
